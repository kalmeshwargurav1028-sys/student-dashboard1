{% extends 'base.html' %}

{% block header_title %}Student Dashboard{% endblock %}

{% block content %}
<div class="w-full py-4 px-4 sm:px-6 lg:px-8">

    <div class="relative bg-gradient-to-r from-[#1e5a97] via-[#2563eb] to-[#3b82f6] rounded-2xl px-4 py-3 sm:px-6 sm:py-3.5 shadow-md text-white mb-6 flex flex-row justify-between items-center gap-4 w-full">
        <div class="absolute inset-0 overflow-hidden rounded-2xl pointer-events-none">
            <div class="absolute -right-8 -bottom-10 w-40 h-40 bg-white/10 rounded-full blur-2xl"></div>
            <div class="absolute -left-6 -top-8 w-28 h-28 bg-sky-300/20 rounded-full blur-xl"></div>
        </div>

        <div class="flex items-center gap-3 sm:gap-4 relative z-10 min-w-0">
            <div class="banner-avatar shrink-0 h-12 w-12 sm:h-14 sm:w-14 rounded-xl bg-white p-0.5">
                <img src="{{ url_for('static', filename='images/student-banner-study.png') }}" alt="Student" class="h-full w-full object-contain rounded-lg">
            </div>
            <div class="min-w-0">
                <p class="text-xs sm:text-sm text-blue-100 font-medium">Welcome back</p>
                <h1 class="text-lg sm:text-xl font-semibold tracking-wide truncate">{{ student.name | title }}</h1>
                <p class="text-xs sm:text-sm text-blue-100 mt-0.5">Student &nbsp;·&nbsp; {{ academic_year_label }}</p>
            </div>
        </div>
        
        <div class="relative z-30 shrink-0" data-profile-menu>
            <button type="button" onclick="event.stopPropagation(); toggleBannerProfile(this)" class="flex items-center gap-3 bg-white/10 hover:bg-white/20 transition-colors px-4 py-2.5 rounded-xl border border-white/10 focus:outline-none w-full text-left">
                <div class="flex flex-col items-end">
                    <span class="text-sm font-semibold text-white">My Profile</span>
                    <span class="text-[10px] uppercase font-bold tracking-wider text-blue-200">Manage Settings</span>
                </div>
                <div class="relative h-10 w-10 rounded-xl overflow-hidden border border-white/20 bg-white flex items-center justify-center shrink-0">
                    {% if session.get('photo_url') %}
                    <img src="{{ session.get('photo_url') }}" 
                         alt="" 
                         class="h-full w-full object-cover"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    {% endif %}
                    <img src="{{ url_for('static', filename='images/banner-emblem.png') }}" alt="" class="h-full w-full object-contain {% if session.get('photo_url') %}hidden{% endif %}">
                </div>
            </button>
            <div data-profile-dropdown class="hidden absolute right-0 top-full mt-2 w-48 bg-white rounded-xl shadow-xl py-2 border border-gray-100 z-50">
                <a href="{{ url_for('student_profile', student_id=session.get('user_id')) }}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-700 transition-colors">View Profile</a>
                <div class="border-t border-gray-100 my-1"></div>
                <a href="{{ url_for('logout') }}" class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors">Logout</a>
            </div>
        </div>
    </div>

    {% include 'includes/your_tools.html' %}
</div>
{% endblock %}
