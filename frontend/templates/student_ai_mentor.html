{% extends 'base.html' %}

{% block content %}
<div class="w-full py-8 px-8 sm:px-10 lg:px-12">
    
    <div class="mb-6 flex items-center justify-between">
        <a href="{{ url_for('student_profile', student_id=student.id) }}" class="text-blue-600 hover:text-blue-800 text-sm font-medium flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
            Back to Profile
        </a>
    </div>

    <!-- AI Mentor Assistant -->
    <div class="bg-white shadow sm:rounded-xl border border-gray-100 overflow-hidden flex flex-col h-[600px]">
        <div class="px-4 py-3 sm:px-6 border-b border-gray-200 bg-blue-600 flex items-center justify-between">
            <h3 class="text-lg leading-6 font-medium text-white flex items-center gap-2">
                <svg class="h-6 w-6 text-blue-100" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                AI Mentor Assistant
            </h3>
            <div class="flex items-center gap-3">
                <select id="ai-language-select" class="text-xs bg-white text-blue-800 rounded px-2 py-1 border-0 focus:ring-2 focus:ring-blue-300">
                    <option value="English">English</option>
                    <option value="Hindi">Hindi (हिंदी)</option>
                    <option value="Kannada">Kannada (ಕನ್ನಡ)</option>
                    <option value="Marathi">Marathi (मराठी)</option>
                </select>
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
                    Online
                </span>
            </div>
        </div>
        
        <!-- Chat History -->
        <div id="ai-chat-history" class="flex-1 p-4 overflow-y-auto bg-gray-50 flex flex-col gap-4">
            <!-- Messages will be injected here -->
        </div>
        
        <!-- Input Area -->
        <div class="p-4 border-t border-gray-200 bg-white">
            <form id="ai-chat-form" class="flex gap-2">
                <input type="text" id="ai-chat-input" class="flex-1 shadow-sm focus:ring-blue-500 focus:border-blue-500 block w-full sm:text-sm border-gray-300 rounded-md py-2 px-3 border" placeholder="Ask for tips or improvement suggestions...">
                <button type="submit" class="inline-flex items-center px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Send
                    <svg class="ml-2 -mr-1 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>
                </button>
            </form>
        </div>
    </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const chatHistory = document.getElementById('ai-chat-history');
    const chatForm = document.getElementById('ai-chat-form');
    const chatInput = document.getElementById('ai-chat-input');
    const languageSelect = document.getElementById('ai-language-select');
    const studentId = "{{ student.id }}";
    
    let currentAudio = null;

    async function speakTextElevenLabs(text, playBtnElement) {
        try {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }

            if (playBtnElement) {
                playBtnElement.innerHTML = `<svg class="w-4 h-4 animate-spin text-blue-600" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>`;
            }

            const response = await fetch('/api/tts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    text: text,
                    voice_id: "Xb7hH8MSUJpSbSDYk0k2",
                    model_id: "eleven_turbo_v2_5"
                })
            });


            if (response.ok) {
                const blob = await response.blob();
                const audioUrl = URL.createObjectURL(blob);
                currentAudio = new Audio(audioUrl);
                
                if (playBtnElement) {
                    playBtnElement.innerHTML = `<svg class="w-4 h-4 text-blue-600 animate-pulse" fill="currentColor" viewBox="0 0 24 24"><path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM3 9v6h4l5 5V4L7 9H3z"/></svg>`;
                }

                currentAudio.onended = () => {
                    if (playBtnElement) {
                        playBtnElement.innerHTML = `<svg class="w-4 h-4 text-gray-500 hover:text-blue-600" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>`;
                    }
                };

                await currentAudio.play();
                return;
            }
        } catch (err) {
            console.warn('ElevenLabs TTS failed, falling back to Web Speech:', err);
        }

        // Fallback to Web Speech Synthesis
        if ('speechSynthesis' in window) {
            const cleanText = text.replace(/[#\-_*`~]/g, '').replace(/\n+/g, ' ').trim();
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = 0.95;
            utterance.pitch = 1.05;
            window.speechSynthesis.speak(utterance);
        }

        if (playBtnElement) {
            playBtnElement.innerHTML = `<svg class="w-4 h-4 text-gray-500 hover:text-blue-600" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>`;
        }
    }

    function addMessage(text, isUser) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
        
        const bubble = document.createElement('div');
        bubble.className = `max-w-[75%] rounded-lg px-4 py-2 text-sm relative group ${isUser ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white border border-gray-200 text-gray-800 rounded-bl-none shadow-sm flex flex-col gap-1'}`;
        
        const textSpan = document.createElement('div');
        textSpan.innerText = text;
        bubble.appendChild(textSpan);

        if (!isUser) {
            const controlsDiv = document.createElement('div');
            controlsDiv.className = 'flex items-center justify-end mt-1 gap-2 pt-1 border-t border-gray-100';

            const speakBtn = document.createElement('button');
            speakBtn.type = 'button';
            speakBtn.className = 'p-1 hover:bg-gray-100 rounded transition-colors text-xs flex items-center gap-1 text-gray-500 hover:text-blue-600';
            speakBtn.title = 'Listen with ElevenLabs AI Voice';
            speakBtn.innerHTML = `<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg><span class="text-[10px] font-medium">Listen</span>`;
            
            speakBtn.onclick = () => speakTextElevenLabs(text, speakBtn);
            controlsDiv.appendChild(speakBtn);
            bubble.appendChild(controlsDiv);

            // Auto-speak ElevenLabs voice on new incoming response
            speakTextElevenLabs(text, speakBtn);
        }
        
        msgDiv.appendChild(bubble);
        chatHistory.appendChild(msgDiv);
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    
    function addTypingIndicator() {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'flex justify-start typing-indicator-container';
        msgDiv.innerHTML = `
            <div class="bg-white border border-gray-200 rounded-lg rounded-bl-none px-4 py-3 shadow-sm flex items-center gap-1">
                <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0ms;"></div>
                <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 150ms;"></div>
                <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 300ms;"></div>
            </div>
        `;
        chatHistory.appendChild(msgDiv);
        chatHistory.scrollTop = chatHistory.scrollHeight;
        return msgDiv;
    }

    async function sendMessage(message) {
        try {
            const response = await fetch(`/api/analyze_student/${studentId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message, language: languageSelect.value })
            });
            const data = await response.json();
            return data.response || "I'm having trouble connecting to my brain right now.";
        } catch (error) {
            console.error('Error:', error);
            return "Sorry, I encountered an error while analyzing the data.";
        }
    }
    
    // Initial Analysis Load
    setTimeout(async () => {
        const indicator = addTypingIndicator();
        const responseText = await sendMessage('initial');
        indicator.remove();
        addMessage(responseText, false);
    }, 500);

    // Handle Form Submit
    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = chatInput.value.trim();
        if (!text) return;
        
        addMessage(text, true);
        chatInput.value = '';
        
        const indicator = addTypingIndicator();
        const responseText = await sendMessage(text);
        indicator.remove();
        
        addMessage(responseText, false);
    });
});
</script>
{% endblock %}
