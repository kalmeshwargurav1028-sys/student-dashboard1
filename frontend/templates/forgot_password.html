<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password · Indus Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        html, body { font-family: 'Inter', system-ui, sans-serif; }
        .field-input:focus { outline: none; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12); }
    </style>
</head>
<body class="min-h-screen bg-[#eef3f9] text-gray-900 antialiased">
    <main class="min-h-screen flex items-center justify-center px-4 py-10">
        <div class="w-full max-w-[420px] bg-white rounded-3xl shadow-sm border border-gray-100 px-6 py-8 sm:px-8">
            <div class="flex justify-center mb-6">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Indus International School" class="h-20 w-auto object-contain">
            </div>

            <h1 class="text-center text-2xl font-semibold tracking-tight text-gray-900">Forgot password</h1>

            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="mt-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" role="alert">
                {% for message in messages %}
                <p>{{ message }}</p>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <form action="{{ url_for('forgot_password') }}" method="POST" class="mt-6 space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
                    <input type="email" id="email" name="email" required autofocus autocomplete="username"
                        class="field-input w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-gray-900 placeholder:text-gray-400"
                        placeholder="Enter your email">
                </div>

                <button type="submit" class="w-full rounded-xl bg-[#1d4ed8] hover:bg-[#1e40af] text-white text-sm font-semibold py-3 mt-2 transition">
                    Send reset code
                </button>
            </form>

            <p class="mt-6 text-center">
                <a href="{{ url_for('login') }}" class="text-sm text-gray-500 hover:text-gray-800">Back to sign in</a>
            </p>
        </div>
    </main>
</body>
</html>
