<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password · Indus LMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        html, body { font-family: 'Inter', system-ui, sans-serif; }
        body {
            background-color: #f4f8fc;
            background-image: radial-gradient(#dbe7f5 1px, transparent 1px);
            background-size: 22px 22px;
        }
        .field-input:focus { outline: none; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14); border-color: #93c5fd; }
    </style>
</head>
<body class="min-h-screen text-gray-900 antialiased">
    <main class="min-h-screen flex items-center justify-center px-4 py-10">
        <div class="w-full max-w-5xl min-h-[620px] bg-white rounded-[28px] shadow-[0_20px_50px_rgba(30,64,175,0.12)] overflow-hidden flex flex-col md:flex-row">
            <aside class="md:w-[42%] bg-gradient-to-b from-[#cfe5ff] via-[#7eb6f5] to-[#3b82f6] px-10 py-12 flex flex-col text-[#123a6b]">
                <h2 class="text-center text-2xl font-bold tracking-tight">Indus LMS</h2>
                <div class="flex-1 flex flex-col justify-center mt-10 md:mt-0">
                    <h1 class="text-4xl font-bold tracking-tight">Welcome Back</h1>
                    <p class="mt-2 text-base font-medium text-[#1e4e8c]/80">Access your School LMS dashboard</p>
                </div>
            </aside>
            <section class="md:w-[58%] px-8 py-12 sm:px-14 flex flex-col justify-center">
                <div class="w-full max-w-sm mx-auto">
                    <div class="flex justify-center mb-5">
                        <div class="rounded-2xl border border-gray-200 bg-white p-3 shadow-sm">
                            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Indus International School" class="h-20 w-auto object-contain">
                        </div>
                    </div>
                    <h2 class="text-center text-3xl font-bold text-[#123a6b] mb-6">Forgot Password</h2>
                    {% with messages = get_flashed_messages() %}
                    {% if messages %}
                    <div class="mb-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" role="alert">
                        {% for message in messages %}
                        <p>{{ message }}</p>
                        {% endfor %}
                    </div>
                    {% endif %}
                    {% endwith %}
                    <form action="{{ url_for('forgot_password') }}" method="POST" class="space-y-4">
                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-600 mb-1.5">Email</label>
                            <input type="email" id="email" name="email" required autofocus
                                class="field-input w-full rounded-lg border border-gray-200 px-4 py-3 text-sm"
                                placeholder="Enter your email">
                        </div>
                        <button type="submit" class="w-full mt-2 rounded-lg bg-[#2563eb] hover:bg-[#1d4ed8] text-white text-sm font-bold tracking-wide py-3.5">
                            SEND RESET CODE
                        </button>
                    </form>
                    <p class="mt-8 text-center">
                        <a href="{{ url_for('login') }}" class="text-sm font-medium text-[#2563eb] hover:text-blue-800">Back to Login</a>
                    </p>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
