<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set new password · Indus Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        html, body { font-family: 'Inter', system-ui, sans-serif; }
        .field-input:focus { outline: none; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12); }
    </style>
</head>
<body class="min-h-screen bg-[#eef3f9] text-gray-900 antialiased">
    <main class="min-h-screen flex items-center justify-center px-4 py-10">
        <div class="w-full max-w-[420px] bg-white rounded-3xl shadow-sm border border-gray-100 px-6 py-8 sm:px-8">
            <div class="flex justify-center mb-6">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Indus International School" class="h-20 w-auto object-contain">
            </div>

            <h1 class="text-center text-2xl font-semibold tracking-tight text-gray-900">Set new password</h1>

            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="mt-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" role="alert">
                {% for message in messages %}
                <p>{{ message }}</p>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <form action="{{ url_for('reset_password') }}" method="POST" class="mt-6 space-y-4" onsubmit="return validatePassword()">
                <input type="hidden" name="email" value="{{ email }}">

                <div>
                    <label for="otp" class="block text-sm font-medium text-gray-700 mb-1.5">Reset code</label>
                    <input type="text" id="otp" name="otp" required autocomplete="one-time-code" inputmode="numeric"
                        class="field-input w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-gray-900 placeholder:text-gray-400"
                        placeholder="Enter the code sent to your email">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">New password</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password"
                        class="field-input w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-gray-900 placeholder:text-gray-400"
                        placeholder="Enter a new password">
                </div>

                <div>
                    <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1.5">Confirm password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password"
                        class="field-input w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-gray-900 placeholder:text-gray-400"
                        placeholder="Retype new password">
                    <p id="password_error" class="text-red-600 text-xs mt-2 hidden">Passwords do not match.</p>
                </div>

                <button type="submit" class="w-full rounded-xl bg-[#1d4ed8] hover:bg-[#1e40af] text-white text-sm font-semibold py-3 mt-2 transition">
                    Change password
                </button>
            </form>

            <p class="mt-6 text-center">
                <a href="{{ url_for('login') }}" class="text-sm text-gray-500 hover:text-gray-800">Back to sign in</a>
            </p>
        </div>
    </main>
    <script>
        function validatePassword() {
            var password = document.getElementById('password').value;
            var confirmPassword = document.getElementById('confirm_password').value;
            var errorElement = document.getElementById('password_error');
            if (password !== confirmPassword) {
                errorElement.classList.remove('hidden');
                return false;
            }
            errorElement.classList.add('hidden');
            return true;
        }
    </script>
</body>
</html>
