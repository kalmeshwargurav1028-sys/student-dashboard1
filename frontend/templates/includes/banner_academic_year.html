{# Horizontal academic-year selector for home blue banners. #}
<div class="relative z-10 w-full flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
    <div class="min-w-0">
        <p class="text-xs sm:text-sm text-blue-100/90 font-medium">Academic year</p>
        <p class="text-base sm:text-lg font-semibold tracking-wide">Choose a year to load its data</p>
    </div>
    <div class="flex items-center overflow-x-auto">
        <div class="inline-flex items-stretch rounded-xl bg-white/15 border border-white/25 p-1 gap-1 backdrop-blur-sm shrink-0" role="group" aria-label="Academic year">
            {% for period in ay_period_choices %}
            <a href="{{ url_for('select_academic_year', period=period) }}"
               class="px-3.5 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold whitespace-nowrap transition-colors
               {% if selected_academic_period == period %}bg-white text-sky-700 shadow-sm{% else %}text-white/90 hover:bg-white/15{% endif %}">
                {{ period }}
            </a>
            {% endfor %}
        </div>
    </div>
</div>
