{% extends "base.html" %}
{% block header_title %}Unit Plan{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto py-8 px-8 sm:px-10 lg:px-12">
    <div class="mb-6 flex items-center gap-3">
        <a href="{{ url_for('dashboard') }}" class="text-gray-400 hover:text-gray-600 transition">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Unit plan</h1>
            <p class="text-sm text-gray-500 mt-1">
                Class {{ grade or '—' }} {{ section or '' }}{% if subject %} · {{ subject }}{% endif %}
            </p>
        </div>
    </div>

    <form method="POST" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 space-y-5">
        <input type="hidden" name="grade" value="{{ grade }}">
        <input type="hidden" name="section" value="{{ section }}">
        <input type="hidden" name="subject" value="{{ subject }}">

        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Unit title</label>
            <input type="text" name="title" value="{{ plan.get('title', '') }}" class="w-full border border-gray-200 rounded-xl px-4 py-2 bg-gray-50 text-sm focus:ring-blue-500 focus:border-blue-500" placeholder="e.g. Fractions — Week 1 to 3">
        </div>
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Duration</label>
            <input type="text" name="duration" value="{{ plan.get('duration', '') }}" class="w-full border border-gray-200 rounded-xl px-4 py-2 bg-gray-50 text-sm focus:ring-blue-500 focus:border-blue-500" placeholder="e.g. 3 weeks">
        </div>
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Learning objectives</label>
            <textarea name="objectives" rows="4" class="w-full border border-gray-200 rounded-xl px-4 py-2 bg-gray-50 text-sm focus:ring-blue-500 focus:border-blue-500" placeholder="What students should be able to do by the end of this unit">{{ plan.get('objectives', '') }}</textarea>
        </div>
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Topics / outline</label>
            <textarea name="topics" rows="6" class="w-full border border-gray-200 rounded-xl px-4 py-2 bg-gray-50 text-sm focus:ring-blue-500 focus:border-blue-500" placeholder="Lesson topics, activities, and assessments">{{ plan.get('topics', '') }}</textarea>
        </div>
        {% if plan.get('updated_at') %}
        <p class="text-xs text-gray-400">Last saved {{ plan.get('updated_at') }}</p>
        {% endif %}
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-medium">Save unit plan</button>
    </form>
</div>
{% endblock %}
