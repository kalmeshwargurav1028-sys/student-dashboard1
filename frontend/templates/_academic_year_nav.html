{% set year_open = true %}
<li class="px-3 pt-2 pb-1">
    <span class="text-[10px] font-bold uppercase tracking-widest text-sky-100 dark:text-gray-500 sidebar-text">Academic Year {{ academic_year_short }}</span>
</li>
<li>
    <button type="button" id="year-toggle" class="w-[calc(100%-1rem)] mx-2 flex items-center justify-between px-4 py-2.5 text-blue-100 hover:bg-sky-600/55 hover:text-white rounded-lg transition-colors bg-white/10">
        <span class="flex items-center min-w-0">
            <svg class="h-5 w-5 flex-shrink-0 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
            <span class="sidebar-text text-sm leading-tight">{{ academic_year_short }} calendar</span>
        </span>
        <svg data-year-chevron class="h-4 w-4 flex-shrink-0 sidebar-text transition-transform rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
    </button>
    <ul id="year-menu" class="mt-1 space-y-0.5 ml-4 pl-2 border-l border-sky-200/40">
        <li>
            <a href="{{ url_for('school_calendar') }}" class="flex items-center px-3 py-2 text-blue-100 hover:bg-sky-600/55 hover:text-white rounded-lg mx-2 text-sm {% if current_path.startswith('/school-calendar') %}bg-white/20 text-white font-semibold{% endif %}">School Calendar</a>
        </li>
        <li>
            <a href="{{ url_for('school_updates') }}" class="flex items-center px-3 py-2 text-blue-100 hover:bg-sky-600/55 hover:text-white rounded-lg mx-2 text-sm {% if current_path.startswith('/school-updates') %}bg-white/20 text-white font-semibold{% endif %}">Updates</a>
        </li>
    </ul>
</li>
